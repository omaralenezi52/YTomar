name: Build YTomar.dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout المشروع
        uses: actions/checkout@v4
        with:
          path: src

      - name: جلب Theos (عبر checkout الموثوق)
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          submodules: recursive
          path: theos

      - name: تثبيت أداة التوقيع ldid
        run: brew install ldid

      - name: جلب iOS SDK واحدة فقط (sparse-checkout سريع)
        run: |
          set -e
          git clone --filter=blob:none --sparse https://github.com/theos/sdks.git sdks-repo
          cd sdks-repo
          git sparse-checkout set iPhoneOS16.5.sdk
          cd ..
          mkdir -p theos/sdks
          cp -r sdks-repo/iPhoneOS16.5.sdk theos/sdks/
          rm -rf sdks-repo
          echo "SDKs:"; ls theos/sdks

      - name: تشخيص البيئة قبل البناء
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          echo "THEOS=$THEOS"
          echo "--- theos/sdks ---"; ls -la "$THEOS/sdks" || echo "no sdks dir"
          echo "--- xcode sdk ---"; xcrun --sdk iphoneos --show-sdk-path || true
          echo "--- theos bin ---"; ls "$THEOS/bin" | head || true

      - name: بناء الـ dylib + الحزمة (verbose)
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          cd src
          make clean
          make FINALPACKAGE=1 messages=yes || { echo "::error::MAKE FAILED"; exit 2; }
          make package FINALPACKAGE=1 messages=yes || true
          echo "=== الملفات الناتجة ==="
          find .theos/obj -name '*.dylib' -print
          ls -la packages/ || true

      - name: رفع YTomar.dylib (الملف الخام)
        uses: actions/upload-artifact@v4
        with:
          name: YTomar-dylib
          path: src/.theos/obj/YTomar.dylib
          if-no-files-found: error

      - name: رفع حزمة .deb
        uses: actions/upload-artifact@v4
        with:
          name: YTomar-deb
          path: src/packages/*.deb
          if-no-files-found: warn
