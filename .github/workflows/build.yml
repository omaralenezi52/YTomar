name: Build YTomar.dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout المشروع
        uses: actions/checkout@v4
        with:
          path: src

      - name: جلب Theos (عبر checkout الموثوق)
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          submodules: recursive
          path: theos

      - name: جلب iOS SDK واحدة فقط (sparse-checkout سريع)
        run: |
          set -e
          git clone --filter=blob:none --sparse https://github.com/theos/sdks.git sdks-repo
          cd sdks-repo
          git sparse-checkout set iPhoneOS16.5.sdk
          cd ..
          mkdir -p theos/sdks
          cp -r sdks-repo/iPhoneOS16.5.sdk theos/sdks/
          rm -rf sdks-repo
          echo "SDKs:"; ls theos/sdks

      - name: بناء الـ dylib + الحزمة
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -e
          cd src
          make clean
          make FINALPACKAGE=1
          make package FINALPACKAGE=1
          echo "=== الملفات الناتجة ==="
          find .theos/obj -name '*.dylib' -print
          ls -la packages/ || true

      - name: رفع YTomar.dylib (الملف الخام)
        uses: actions/upload-artifact@v4
        with:
          name: YTomar-dylib
          path: src/.theos/obj/YTomar.dylib
          if-no-files-found: error

      - name: رفع حزمة .deb
        uses: actions/upload-artifact@v4
        with:
          name: YTomar-deb
          path: src/packages/*.deb
          if-no-files-found: warn
