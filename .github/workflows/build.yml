name: Build YTomar (faithful, from upstream)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # للسماح بنشر اللوق في فرع ci-logs

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout (سكربت الوسم)
        uses: actions/checkout@v4
        with:
          path: ytomar
          token: ${{ github.token }}

      - name: جلب Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          submodules: recursive
          path: theos

      - name: أدوات البناء (ldid + dpkg + make)
        run: brew install ldid dpkg make

      - name: SDK هجين (أساس Xcode + أطر theos الخاصة) باسم 16.5
        run: |
          exec > >(tee "$GITHUB_WORKSPACE/sdk.log") 2>&1
          set -e
          # 1) أساس: SDK الخاص بـXcode (متوافق مع الكلانغ)
          SDKREAL=$(cd "$(xcrun --sdk iphoneos --show-sdk-path)" && pwd -P)
          echo "Xcode iOS SDK: $SDKREAL"
          mkdir -p theos/sdks
          cp -R "$SDKREAL" theos/sdks/iPhoneOS16.5.sdk
          # 2) نجلب أطر theos الخاصة (cone مضيّق على PrivateFrameworks فقط)
          git clone --filter=blob:none --sparse https://github.com/theos/sdks.git sdks-repo
          ( cd sdks-repo && git sparse-checkout set iPhoneOS16.5.sdk/System/Library/PrivateFrameworks )
          SRC="sdks-repo/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks"
          DST="theos/sdks/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks"
          echo "عدد الأطر في المصدر:"; ls "$SRC" | wc -l
          mkdir -p "$DST"
          cp -R "$SRC"/. "$DST"/
          # تحقق صارم من Preferences
          if [ -e "$DST/Preferences.framework/Preferences.tbd" ]; then
            echo "✅ Preferences.tbd موجود بعد الأوفرلاي"
          else
            echo "❌ Preferences.tbd مفقود! محتوى المصدر:"; ls "$SRC" | grep -i pref || true
            exit 1
          fi
          rm -rf sdks-repo
          ls theos/sdks

      - name: استنساخ مصدر uYouPlus كامل
        run: |
          git clone --recursive https://github.com/qnblackcat/uYouPlus.git upstream 2>&1 | tail -5
          echo "submodules:"; ls upstream

      - name: تحديث المصادر لأحدث نسخة (إصلاحات توافق مع التولتشين الحديث)
        run: |
          cd upstream
          git submodule update --init --recursive --remote 2>&1 | tail -25 || true
          # تمريرة ثانية: تهيئة أي submodule متداخل أُضيف بالنسخ الأحدث (مثل YTUHD/vpx)
          git submodule update --init --recursive 2>&1 | tail -25 || true
          echo "=== فحص vpx ==="
          find Tweaks -type d -iname 'vpx*' 2>/dev/null | head
          find Tweaks -name 'vpx_decoder.h' 2>/dev/null | head
          echo "=== تم تحديث الـsubmodules ==="

      - name: تطبيق وسم YTomar (@o5252i)
        run: |
          cp ytomar/branding/apply.sh upstream/apply.sh
          cd upstream && bash apply.sh

      - name: بناء الحزمة (بدون إخفاء الأخطاء)
        id: build
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          # نلتقط كل مخرجات الخطوة (حتى الأخطاء المبكرة) في build.log
          exec > >(tee "$GITHUB_WORKSPACE/build.log") 2>&1
          set -o pipefail
          cd upstream
          echo "THEOS=$THEOS"; echo "SDKs:"; ls "$THEOS/sdks" || echo "(no sdks dir!)"
          make clean || true
          make package FINALPACKAGE=1 messages=yes GO_EASY_ON_ME=1 \
            UYOU_URL="https://repo.miro92.com/debs/com.miro.uyou_3.0.4_iphoneos-arm.deb"
          echo "=== packages ==="; ls -la packages/ || true

      - name: نشر اللوق في فرع ci-logs (حتى عند الفشل)
        if: always()
        run: |
          cd ytomar
          git config user.name "ci"; git config user.email "ci@local"
          git checkout --orphan ci-logs 2>/dev/null || git checkout ci-logs
          git rm -rf --cached . >/dev/null 2>&1 || true
          { echo "===== SDK STEP ====="; cat "$GITHUB_WORKSPACE/sdk.log" 2>/dev/null || echo "(no sdk.log)"; \
            echo; echo "===== BUILD STEP (tail) ====="; tail -c 55000 "$GITHUB_WORKSPACE/build.log" 2>/dev/null || echo "(no build.log)"; } > latest.log
          git add -f latest.log
          git commit -m "CI build log" >/dev/null 2>&1 || true
          git push -f origin ci-logs

      - name: رفع الحزمة
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YTomar-package
          path: |
            upstream/packages/*.deb
            build.log
          if-no-files-found: warn
