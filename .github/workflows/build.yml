name: Build YTomar (faithful, from upstream)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # للسماح بنشر اللوق في فرع ci-logs

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout (سكربت الوسم)
        uses: actions/checkout@v4
        with:
          path: ytomar
          token: ${{ github.token }}

      - name: جلب Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          submodules: recursive
          path: theos

      - name: أدوات البناء (ldid + dpkg + make)
        run: brew install ldid dpkg make

      - name: استخدام SDK الخاص بـXcode في الـrunner (مطابق للكلانغ) وتسميته 16.5
        run: |
          set -e
          SDKREAL=$(cd "$(xcrun --sdk iphoneos --show-sdk-path)" && pwd -P)
          echo "Xcode iOS SDK الفعلي: $SDKREAL"
          mkdir -p theos/sdks
          cp -R "$SDKREAL" theos/sdks/iPhoneOS16.5.sdk
          echo "نُسخ كـ iPhoneOS16.5.sdk"
          ls -la theos/sdks

      - name: استنساخ مصدر uYouPlus كامل
        run: |
          git clone --recursive https://github.com/qnblackcat/uYouPlus.git upstream 2>&1 | tail -5
          echo "submodules:"; ls upstream

      - name: تطبيق وسم YTomar (@o5252i)
        run: |
          cp ytomar/branding/apply.sh upstream/apply.sh
          cd upstream && bash apply.sh

      - name: بناء الحزمة (بدون إخفاء الأخطاء)
        id: build
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          set -o pipefail
          cd upstream
          echo "THEOS=$THEOS ; SDKs:"; ls "$THEOS/sdks"
          make clean || true
          # نمرّر UYOU_URL لإصلاح شرط uYouPlus الفاضي + تنزيل uYou وتضمينه
          make package FINALPACKAGE=1 messages=yes \
            UYOU_URL="https://repo.miro92.com/debs/com.miro.uyou_3.0.4_iphoneos-arm.deb" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          echo "=== packages ==="; ls -la packages/ || true

      - name: نشر اللوق في فرع ci-logs (حتى عند الفشل)
        if: always()
        run: |
          cd ytomar
          git config user.name "ci"; git config user.email "ci@local"
          git checkout --orphan ci-logs 2>/dev/null || git checkout ci-logs
          git rm -rf --cached . >/dev/null 2>&1 || true
          tail -c 60000 "$GITHUB_WORKSPACE/build.log" > latest.log 2>/dev/null || echo "no build.log produced" > latest.log
          git add -f latest.log
          git commit -m "CI build log" >/dev/null 2>&1 || true
          git push -f origin ci-logs

      - name: رفع الحزمة
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YTomar-package
          path: |
            upstream/packages/*.deb
            build.log
          if-no-files-found: warn
